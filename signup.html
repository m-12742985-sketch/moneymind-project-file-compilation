<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up | Cute Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-pink-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-3xl shadow-lg max-w-md w-full border-4 border-pink-200">
        <h2 class="text-3xl font-bold text-pink-400 text-center mb-2">Welcome! 💕</h2>
        <p class="text-gray-500 text-center mb-6">Create an account with just a username</p>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            
            <div>
                <label class="block text-sm font-semibold text-gray-600 mb-1">Username</label>
                {{ form.username }}
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-600 mb-1">Password</label>
                {{ form.password }}
            </div>

            <button type="submit" class="w-full py-3 bg-pink-300 hover:bg-pink-400 text-white font-bold rounded-2xl shadow-md transition-all">
                Sign Up ✨
            </button>
        </form>

        <p class="text-center text-sm text-gray-500 mt-6">
            Already have an account? 
            <a href="{% url 'login' %}" class="text-pink-400 font-bold hover:underline">Log in here</a>
        </p>
    </div>

</body>
</html>
